# everforest dark hard (neanias/everforest-nvim)
# Used by every swaylock call: $lock, swayidle and wlogout pass no colours of their own.
font=JetBrainsMono Nerd Font
indicator-radius=100
indicator-thickness=10

color=1e2326

# ring: idle grey, green while typing, orange on backspace
ring-color=414b50
key-hl-color=a7c080
bs-hl-color=e69875
caps-lock-key-hl-color=a7c080
caps-lock-bs-hl-color=e69875
ring-clear-color=dbbc7f
ring-caps-lock-color=e69875
ring-ver-color=7fbbb3
ring-wrong-color=e67e80

inside-color=00000000
inside-clear-color=00000000
inside-caps-lock-color=00000000
inside-ver-color=384b55
inside-wrong-color=493b40

line-color=00000000
line-clear-color=00000000
line-caps-lock-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000

text-color=d3c6aa
text-clear-color=dbbc7f
text-caps-lock-color=e69875
text-ver-color=7fbbb3
text-wrong-color=e67e80

layout-bg-color=00000000
layout-border-color=00000000
layout-text-color=d3c6aa
